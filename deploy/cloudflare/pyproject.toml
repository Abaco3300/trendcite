[project]
name = "trendcite-cloudflare-runtime"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31",
    "trendcite",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false

[tool.uv.sources]
# Build this wheel from the exact repository checkpoint before pywrangler sync/deploy.
# This prevents Cloudflare from resolving the older public PyPI package.
trendcite = { path = "wheelhouse/trendcite-0.1.0-py3-none-any.whl" }
